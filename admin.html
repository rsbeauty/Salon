<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin WhatsApp Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .wa-bg { background-color: #111b21; }
    .wa-chat-bg { background-color: #0b141a; background-image: radial-gradient(#202c33 1px, transparent 1px); background-size: 20px 20px; }
  </style>
</head>
<body class="bg-[#0c1317] text-slate-100 h-screen flex overflow-hidden">

  <!-- ADMIN AUTH MODAL -->
  <div id="adminAuth" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
    <div class="bg-[#111b21] p-6 sm:p-8 rounded-2xl w-full max-w-md border border-slate-800 space-y-4 shadow-2xl">
      <div class="text-center">
        <div class="text-4xl mb-2">🛡️</div>
        <h2 class="text-xl font-bold text-red-500">Admin Live Control Login</h2>
        <p class="text-xs text-slate-400 mt-1 font-mono">athravsharma2828@gmail.com</p>
      </div>

      <div class="space-y-3">
        <input type="email" id="adminEmail" value="athravsharma2828@gmail.com" class="w-full bg-[#202c33] p-3 rounded-lg text-sm outline-none text-white focus:ring-1 focus:ring-red-500 font-mono">
        <input type="password" id="adminPass" value="123456789" class="w-full bg-[#202c33] p-3 rounded-lg text-sm outline-none text-white focus:ring-1 focus:ring-red-500 font-mono">
        
        <div class="flex gap-2">
          <button onclick="adminLogin()" class="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold text-sm transition">
            1. Try Login
          </button>
          <button onclick="forceCreateAndLogin()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-3 rounded-lg font-bold text-sm transition text-white">
            2. Auto-Fix / Re-Register
          </button>
        </div>
      </div>

      <!-- Live Log Screen -->
      <div class="space-y-1 pt-2">
        <div class="text-[11px] text-slate-400 font-semibold">Live Server Response:</div>
        <div id="authErr" class="text-xs font-mono bg-black/70 p-3 rounded-lg border border-slate-800 text-amber-300 min-h-[60px] whitespace-pre-wrap break-all">
Ready. Click "1. Try Login" or "2. Auto-Fix / Re-Register".
        </div>
      </div>
    </div>
  </div>

  <!-- LEFT SIDEBAR -->
  <div class="w-80 md:w-96 bg-[#111b21] border-r border-slate-800 flex flex-col h-full">
    <div class="p-4 bg-[#202c33] flex justify-between items-center border-b border-slate-700">
      <div>
        <div class="font-bold text-xs text-red-400 tracking-wider">SUPER ADMIN</div>
        <div class="text-[11px] text-slate-400">athravsharma2828</div>
      </div>
      <div class="flex gap-2">
        <button onclick="openBroadcastModal()" class="bg-red-600 hover:bg-red-500 text-xs px-2.5 py-1.5 rounded-md font-bold shadow">📢 Alert</button>
        <button onclick="adminLogout()" class="text-xs text-slate-400 hover:text-white bg-[#2a3942] px-2 py-1.5 rounded">Exit</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-slate-800 text-xs font-semibold">
      <button onclick="setTab('chats')" id="tabChats" class="flex-1 py-3 text-emerald-400 border-b-2 border-emerald-400">Approved Chats</button>
      <button onclick="setTab('approvals')" id="tabApprovals" class="flex-1 py-3 text-slate-400">Pending (<span id="pendingCount">0</span>)</button>
    </div>

    <div id="listContainer" class="flex-1 overflow-y-auto divide-y divide-slate-800/40"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="flex-1 flex flex-col h-full bg-[#0b141a]">
    <div id="chatHeader" class="bg-[#202c33] px-6 py-3.5 flex justify-between items-center border-b border-slate-800">
      <div class="font-semibold text-sm" id="activeUserTitle">Select a user to chat</div>
      <div id="userStatusTag" class="text-xs"></div>
    </div>

    <div id="adminMsgBox" class="flex-1 wa-chat-bg p-6 overflow-y-auto space-y-3 flex flex-col"></div>

    <div class="bg-[#202c33] p-3 flex gap-3 items-center">
      <input type="text" id="adminInput" placeholder="Type WhatsApp reply..." class="flex-1 bg-[#2a3942] px-4 py-3 rounded-full text-sm outline-none text-white focus:ring-1 focus:ring-emerald-500" onkeydown="if(event.key==='Enter') sendAdminReply()">
      <button onclick="sendAdminReply()" class="w-11 h-11 rounded-full bg-emerald-600 hover:bg-emerald-500 flex items-center justify-center text-white">➤</button>
    </div>
  </div>

  <audio id="adminTone" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>

  <script>
    const SUPABASE_URL = "https://kqjzziybvkbkrlpemxdp.supabase.co";
    const SUPABASE_KEY = "sb_publishable__Fiz46xbWxj8ZQMSmCyo0Q_QxCPMzs2";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let activeUserId = null;
    let allProfiles = [];
    let currentTab = 'chats';
    const adminTone = document.getElementById('adminTone');

    function showStatus(text, color = "text-amber-300") {
      const box = document.getElementById('authErr');
      box.className = `text-xs font-mono bg-black/70 p-3 rounded-lg border border-slate-800 whitespace-pre-wrap break-all ${color}`;
      box.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
    }

    async function checkAdmin() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session && session.user.email === 'athravsharma2828@gmail.com') {
        document.getElementById('adminAuth').classList.add('hidden');
        loadData();
        listenRealtime();
      }
    }
    checkAdmin();

    async function adminLogin() {
      showStatus("Connecting to Supabase Auth...", "text-blue-400");
      
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPass').value.trim();

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        showStatus("LOGIN ERROR:\n" + error.message + "\n\n👉 Click green button '2. Auto-Fix / Re-Register' to create account fresh.", "text-red-400");
        return;
      }

      if (data.user && data.user.email === 'athravsharma2828@gmail.com') {
        showStatus("SUCCESS! Logging in...", "text-emerald-400");
        setTimeout(() => {
          document.getElementById('adminAuth').classList.add('hidden');
          loadData();
          listenRealtime();
        }, 500);
      } else {
        showStatus("Access Denied: Logged in user is not admin email.", "text-red-400");
      }
    }

    // Force register admin if user does not exist in Auth
    async function forceCreateAndLogin() {
      showStatus("Creating user via Supabase SignUp API...", "text-blue-400");
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPass').value.trim();

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        showStatus("Auto-Fix Error:\n" + error.message, "text-red-400");
        return;
      }

      showStatus("Account created! Now attempting login...", "text-blue-400");
      await adminLogin();
    }

    async function loadData() {
      const { data } = await supabase.from('profiles').select('*').neq('role', 'admin').order('created_at', { ascending: false });
      allProfiles = data || [];
      renderList();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tabChats').className = tab === 'chats' ? 'flex-1 py-3 text-emerald-400 border-b-2 border-emerald-400' : 'flex-1 py-3 text-slate-400';
      document.getElementById('tabApprovals').className = tab === 'approvals' ? 'flex-1 py-3 text-emerald-400 border-b-2 border-emerald-400' : 'flex-1 py-3 text-slate-400';
      renderList();
    }

    function renderList() {
      const list = document.getElementById('listContainer');
      list.innerHTML = '';
      const pending = allProfiles.filter(p => !p.is_approved);
      document.getElementById('pendingCount').innerText = pending.length;

      const items = currentTab === 'approvals' ? pending : allProfiles.filter(p => p.is_approved);

      if (items.length === 0) {
        list.innerHTML = `<div class="p-6 text-center text-xs text-slate-500">Koi user nahi hai</div>`;
        return;
      }

      items.forEach(u => {
        const div = document.createElement('div');
        div.className = `p-4 flex items-center justify-between cursor-pointer hover:bg-[#202c33] transition ${activeUserId === u.id ? 'bg-[#202c33]' : ''}`;
        
        div.innerHTML = `
          <div>
            <div class="font-semibold text-sm text-slate-200">${u.email}</div>
            <div class="text-[11px] ${u.is_approved ? 'text-emerald-400' : 'text-amber-400'}">${u.is_approved ? '🟢 Approved' : '⏳ Pending'}</div>
          </div>
          <div>
            ${!u.is_approved 
              ? `<button onclick="toggleApprove('${u.id}', true)" class="bg-emerald-600 px-3 py-1 rounded text-xs font-bold hover:bg-emerald-500 shadow">Approve</button>`
              : `<button onclick="toggleApprove('${u.id}', false)" class="text-xs text-red-400 hover:underline">Block</button>`}
          </div>
        `;
        div.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON') selectUser(u);
        };
        list.appendChild(div);
      });
    }

    async function toggleApprove(userId, status) {
      await supabase.from('profiles').update({ is_approved: status }).eq('id', userId);
      loadData();
    }

    async function selectUser(u) {
      activeUserId = u.id;
      document.getElementById('activeUserTitle').innerText = `Chat: ${u.email}`;
      document.getElementById('userStatusTag').innerHTML = u.is_approved ? `<span class="text-emerald-400">● Active</span>` : `<span class="text-amber-400">● Pending</span>`;
      renderList();
      loadActiveMessages();
    }

    async function loadActiveMessages() {
      const box = document.getElementById('adminMsgBox');
      box.innerHTML = '';
      const { data: msgs } = await supabase.from('messages')
        .select('*')
        .or(`and(sender_id.eq.${activeUserId}),and(receiver_id.eq.${activeUserId})`)
        .order('created_at', { ascending: true });

      if (msgs) msgs.forEach(renderAdminBubble);
      box.scrollTop = box.scrollHeight;
    }

    function renderAdminBubble(m) {
      const box = document.getElementById('adminMsgBox');
      const isMe = m.sender_id !== activeUserId;
      const div = document.createElement('div');
      div.className = `max-w-[70%] px-3.5 py-2 rounded-xl text-sm ${isMe ? 'ml-auto bg-[#005c4b] text-white rounded-tr-none' : 'mr-auto bg-[#202c33] text-white rounded-tl-none'}`;
      div.innerHTML = `<div>${m.text}</div><div class="text-[10px] text-slate-400 text-right mt-1">${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function sendAdminReply() {
      if (!activeUserId) return alert("Pehle kisi user ko select karein!");
      const input = document.getElementById('adminInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const { data: { user } } = await supabase.auth.getUser();
      await supabase.from('messages').insert([{
        sender_id: user.id,
        receiver_id: activeUserId,
        text
      }]);
    }

    async function openBroadcastModal() {
      const text = prompt("Broadcast Alert Message likhein (Sabhi users ke phone par sound bajegi):");
      if (!text) return;
      const { data: { user } } = await supabase.auth.getUser();
      await supabase.from('messages').insert([{
        sender_id: user.id,
        receiver_id: null,
        text: `📢 ALERT: ${text}`
      }]);
      alert("Broadcast Alert bhej diya gaya!");
    }

    function listenRealtime() {
      supabase.channel('admin-control-room')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => loadData())
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          const msg = payload.new;
          if (activeUserId && (msg.sender_id === activeUserId || msg.receiver_id === activeUserId)) {
            renderAdminBubble(msg);
          }
          adminTone.currentTime = 0;
          adminTone.play().catch(() => {});
        })
        .subscribe();
    }

    async function adminLogout() {
      await supabase.auth.signOut();
      location.reload();
    }
  </script>
</body>
</html>
