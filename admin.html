<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realtime Chat Admin — Fixed</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0b141a}.chat-bg{background-color:#0b141a;background-image:radial-gradient(#1b2b34 .7px,transparent .7px);background-size:14px 14px}.scrollbar::-webkit-scrollbar{width:6px}.scrollbar::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}.bubble{max-width:min(82%,620px);overflow-wrap:anywhere}</style>
</head>
<body class="min-h-screen text-slate-100">
<div id="app" class="min-h-screen flex items-center justify-center p-4"></div>
<audio id="tone" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>
<script>
(() => {
 const SUPABASE_URL='https://kqjzziybvkbkrlpemxdp.supabase.co';
 const SUPABASE_ANON_KEY='sb_publishable__Fiz46xbWxj8ZQMSmCyo0Q_QxCPMzs2';
 const MASTER_PIN='123456789'; // UI gate only; not secure server-side authorization.\n const ADMIN_ID='ADMIN'; // Requires public.messages.sender_id to be TEXT (see schema.sql).
 const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),app=document.getElementById('app');
 let tab='pending',selected=null,channel=null,profiles=[],seen=new Set();
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const time=s=>new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 function login(){
  app.innerHTML=`<section class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-8 shadow-2xl"><div class="text-4xl mb-4">🔐</div><h1 class="text-2xl font-bold">Admin Dashboard</h1><p class="text-slate-400 mt-2 mb-6">Enter the master PIN to continue.</p><form id="pinForm" class="space-y-3"><input id="pin" type="password" inputmode="numeric" required placeholder="Master PIN" class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3"><button class="w-full rounded-xl bg-emerald-500 text-slate-950 font-bold py-3">Unlock dashboard</button></form><p id="err" class="text-rose-300 text-sm mt-3"></p><p class="text-xs text-slate-500 mt-5">The browser PIN is a demo gate, not production authentication. Secure admin actions with Supabase Auth and server-side policies.</p></section>`;
  document.getElementById('pinForm').onsubmit=e=>{e.preventDefault();if(document.getElementById('pin').value===MASTER_PIN){sessionStorage.setItem('rtchat_admin_unlocked','1');dashboard();}else document.getElementById('err').textContent='Incorrect PIN.';};
 }
 async function dashboard(){
  app.innerHTML=`<main class="w-full max-w-7xl h-[92vh] min-h-[580px] rounded-2xl overflow-hidden border border-slate-700 shadow-2xl flex bg-slate-900"><aside class="w-80 md:w-96 border-r border-slate-700 flex flex-col"><header class="bg-slate-800 p-4 flex items-center justify-between"><div><h1 class="font-bold text-lg">Chat Admin</h1><p class="text-xs text-slate-400">Realtime control center</p></div><button id="lock" class="text-xs bg-slate-700 rounded-lg px-3 py-2">Lock</button></header><div class="p-3"><button id="broadcast" class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-lg py-2.5 font-semibold">🔔 Broadcast Alert</button></div><div class="grid grid-cols-2 gap-2 p-3 pt-0"><button id="pendingTab" class="rounded-lg py-2 text-sm">Pending Approvals</button><button id="activeTab" class="rounded-lg py-2 text-sm">Active Chats</button></div><div id="contactList" class="overflow-y-auto scrollbar flex-1"></div></aside><section class="flex-1 flex flex-col min-w-0"><header class="bg-slate-800 px-5 py-4"><div id="chatTitle" class="font-semibold">Select a customer</div><div class="text-xs text-slate-400">Private 1-on-1 conversation</div></header><div id="messages" class="chat-bg scrollbar overflow-y-auto flex-1 p-4 space-y-3"><p class="text-slate-400 text-sm text-center mt-10">Choose an approved contact to view messages.</p></div><form id="sendForm" class="bg-slate-800 p-3 flex gap-2"><input id="messageInput" maxlength="5000" required placeholder="Reply to selected customer…" class="flex-1 min-w-0 rounded-full bg-slate-700 px-5 py-3 outline-none focus:ring-2 focus:ring-emerald-500"><button class="rounded-full bg-emerald-500 text-slate-950 font-bold px-6">Send</button></form></section></main><div id="toast" class="fixed bottom-4 right-4 hidden bg-slate-700 rounded-xl px-4 py-3 shadow-xl"></div>`;
  document.getElementById('lock').onclick=()=>{sessionStorage.removeItem('rtchat_admin_unlocked');if(channel)db.removeChannel(channel);login();};
  document.getElementById('pendingTab').onclick=()=>{tab='pending';paintContacts();};
  document.getElementById('activeTab').onclick=()=>{tab='active';paintContacts();};
  document.getElementById('broadcast').onclick=broadcast;
  document.getElementById('sendForm').onsubmit=send;
  await refreshProfiles();paintContacts();subscribe();
 }
 async function refreshProfiles(){
  const {data,error}=await db.from('profiles').select('id,email,role,is_approved,created_at').order('created_at',{ascending:true});
  if(error){toast('Could not load profiles: '+error.message);return;}profiles=data||[];
 }
 function paintContacts(){
  const list=document.getElementById('contactList');if(!list)return;
  document.getElementById('pendingTab').className='rounded-lg py-2 text-sm '+(tab==='pending'?'bg-emerald-600 font-semibold':'bg-slate-800');
  document.getElementById('activeTab').className='rounded-lg py-2 text-sm '+(tab==='active'?'bg-emerald-600 font-semibold':'bg-slate-800');
  const rows=profiles.filter(p=>tab==='pending'?!p.is_approved:p.is_approved&&p.role!=='admin');
  list.innerHTML=rows.map(p=>`<div class="p-4 border-b border-slate-800 hover:bg-slate-800 ${selected?.id===p.id?'bg-slate-800':''}"><button class="openContact w-full text-left" data-id="${esc(p.id)}"><div class="font-medium truncate">${esc(p.email)}</div><div class="text-xs text-slate-500 mt-1">${p.is_approved?'Approved':'Awaiting approval'}</div></button>${tab==='pending'?`<button data-id="${esc(p.id)}" class="approve mt-3 w-full rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-sm font-bold py-2">✓ Approve</button>`:''}</div>`).join('')||`<p class="p-4 text-sm text-slate-400">${tab==='pending'?'No pending approvals.':'No active contacts yet.'}</p>`;
  list.querySelectorAll('.openContact').forEach(b=>b.onclick=()=>{selected=profiles.find(p=>p.id===b.dataset.id);if(selected?.is_approved){document.getElementById('chatTitle').textContent=selected.email;loadMessages();paintContacts();}});
  list.querySelectorAll('.approve').forEach(b=>b.onclick=()=>approve(b.dataset.id));
 }
 async function approve(id){
  const {error}=await db.from('profiles').update({is_approved:true}).eq('id',id);
  if(error){toast('Approval failed: '+error.message);return;}await refreshProfiles();paintContacts();toast('User approved.');
 }
 async function loadMessages(){
  const box=document.getElementById('messages');if(!box||!selected)return;
  const {data,error}=await db.from('messages').select('*').or(`and(sender_id.eq.${selected.id},receiver_id.eq.${selected.id}),and(sender_id.eq.${selected.id},receiver_id.is.null),and(receiver_id.eq.${selected.id},sender_id.neq.${selected.id})`).order('created_at',{ascending:true}).limit(300);
  if(error){box.innerHTML=`<p class="text-rose-300 text-sm">${esc(error.message)}</p>`;return;}
  box.innerHTML='';(data||[]).forEach(m=>append(m,false));box.scrollTop=box.scrollHeight;
 }
 function append(m,scroll=true){
  const box=document.getElementById('messages');if(!box||document.getElementById('m'+m.id))return;
  const mine=m.sender_id===ADMIN_ID;
  const div=document.createElement('div');div.id='m'+m.id;div.className='flex '+(mine?'justify-end':'justify-start');
  div.innerHTML=`<div class="bubble rounded-2xl px-4 py-2 shadow ${mine?'bg-emerald-800 text-emerald-50 rounded-br-sm':'bg-slate-700 text-slate-100 rounded-bl-sm'}"><div class="whitespace-pre-wrap">${esc(m.text)}</div><div class="text-[10px] text-slate-300/70 text-right mt-1">${time(m.created_at)}</div></div>`;box.appendChild(div);if(scroll)box.scrollTop=box.scrollHeight;
 }
 async function send(e){
  e.preventDefault();if(!selected){toast('Select an approved customer first.');return;}
  const input=document.getElementById('messageInput'),text=input.value.trim();if(!text)return;
  const {error}=await db.from('messages').insert({sender_id:ADMIN_ID,receiver_id:selected.id,text});
  if(error){toast('Send failed: '+error.message);return;}input.value='';
 }
 async function broadcast(){
  const text=prompt('Enter the broadcast alert message:');if(!text?.trim())return;
  const {error}=await db.from('messages').insert({sender_id:ADMIN_ID,receiver_id:null,text:text.trim()});
  if(error){toast('Broadcast failed: '+error.message);return;}toast('Broadcast sent to connected clients.');
 }
 function toast(s){const t=document.getElementById('toast');if(!t)return;t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500);}
 function subscribe(){
  if(channel)db.removeChannel(channel);
  channel=db.channel('admin-realtime')
   .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},async()=>{await refreshProfiles();paintContacts();})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
    const m=p.new;if(m.receiver_id===null){document.getElementById('tone')?.play().catch(()=>{});toast('Broadcast sent/received: '+m.text);}
    if(selected&&(m.sender_id===selected.id||m.receiver_id===selected.id))append(m);
   }).subscribe();
 }
 if(sessionStorage.getItem('rtchat_admin_unlocked')==='1')dashboard();else login();
})();
</script>
</body></html>
