<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realtime Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0b141a} .chat-bg{background-color:#0b141a;background-image:radial-gradient(#1b2b34 0.7px,transparent .7px);background-size:14px 14px}
.bubble{max-width:min(82%,620px);overflow-wrap:anywhere}.scrollbar::-webkit-scrollbar{width:6px}.scrollbar::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}
</style>
</head>
<body class="min-h-screen text-slate-100">
<div id="app" class="min-h-screen flex items-center justify-center p-4">
  <section class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-7 shadow-2xl">
    <div class="flex items-center gap-3 mb-6"><div class="w-12 h-12 rounded-2xl bg-emerald-500 flex items-center justify-center text-2xl">✉</div><div><h1 class="text-2xl font-bold">Realtime Chat</h1><p class="text-slate-400 text-sm">Sign in with your email</p></div></div>
    <form id="authForm" class="space-y-4">
      <label class="block text-sm text-slate-300">Email address<input id="email" type="email" required autocomplete="email" class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 outline-none focus:border-emerald-400" placeholder="you@example.com"></label>
      <div class="grid grid-cols-2 gap-3"><button class="rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold py-3" type="submit" data-mode="register">Register</button><button class="rounded-xl bg-slate-700 hover:bg-slate-600 font-semibold py-3" type="submit" data-mode="login">Login</button></div>
    </form>
    <p class="text-xs leading-5 text-slate-400 mt-5">Demo note: email-only identity is not secure authentication. For production, use Supabase Auth with email verification.</p>
    <p id="authStatus" class="text-sm mt-4 text-rose-300" role="status"></p>
  </section>
</div>
<audio id="tone" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>
<script>
(() => {
 const SUPABASE_URL='https://kqjzziybvkbkrlpemxdp.supabase.co';
 const SUPABASE_ANON_KEY='sb_publishable__Fiz46xbWxj8ZQMSmCyo0Q_QxCPMzs2';
 const { createClient } = supabase;
 const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 const app=document.getElementById('app'), status=document.getElementById('authStatus');
 let me=null, channel=null, seen=new Set(), activePeer=null;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const time=s=>new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 function showAuth(message=''){
  app.innerHTML=`<section class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-7 shadow-2xl"><div class="flex items-center gap-3 mb-6"><div class="w-12 h-12 rounded-2xl bg-emerald-500 flex items-center justify-center text-2xl">✉</div><div><h1 class="text-2xl font-bold">Realtime Chat</h1><p class="text-slate-400 text-sm">Sign in with your email</p></div></div><form id="authForm" class="space-y-4"><label class="block text-sm text-slate-300">Email address<input id="email" type="email" required class="mt-1 w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3" placeholder="you@example.com"></label><div class="grid grid-cols-2 gap-3"><button class="rounded-xl bg-emerald-500 text-slate-950 font-semibold py-3" type="submit" data-mode="register">Register</button><button class="rounded-xl bg-slate-700 font-semibold py-3" type="submit" data-mode="login">Login</button></div></form><p class="text-xs leading-5 text-slate-400 mt-5">Demo only: email-only identity is not secure authentication. Use Supabase Auth for production.</p><p id="authStatus" class="text-sm mt-4 text-rose-300">${esc(message)}</p></section>`;
  document.getElementById('authForm').addEventListener('submit',authSubmit);
 }
 async function authSubmit(e){
  e.preventDefault(); const email=document.getElementById('email').value.trim().toLowerCase();
  const mode=e.submitter?.dataset.mode||'login'; status.textContent='Please wait…';
  try{
   let {data,error}=await db.from('profiles').select('*').eq('email',email).maybeSingle();
   if(error) throw error;
   if(mode==='register'){
    if(data){status.textContent='This email is already registered. Choose Login.';return;}
    const id=crypto.randomUUID();
    const ins=await db.from('profiles').insert({id,email,role:'user',is_approved:false}).select().single();
    if(ins.error) throw ins.error; data=ins.data;
   } else if(!data){status.textContent='Email not found. Please register first.';return;}
   localStorage.setItem('rtchat_profile',JSON.stringify({id:data.id,email:data.email}));
   me=data; await renderState();
  }catch(err){document.getElementById('authStatus').textContent=err.message||'Request failed';}
 }
 async function loadMe(){
  try{const saved=JSON.parse(localStorage.getItem('rtchat_profile')||'null');if(!saved?.id)return;
   const {data,error}=await db.from('profiles').select('*').eq('id',saved.id).maybeSingle();
   if(error) throw error;if(data){me=data;await renderState();}
  }catch(e){showAuth(e.message||'Unable to restore session');}
 }
 async function renderState(){
  if(!me){showAuth();return;}
  const {data,error}=await db.from('profiles').select('*').eq('id',me.id).single();
  if(error){showAuth(error.message);return;} me=data;
  if(!me.is_approved){renderPending();return;}
  renderChat(); await loadMessages(); subscribe();
 }
 function renderPending(){
  app.innerHTML=`<section class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl p-8 text-center shadow-2xl"><div class="text-5xl mb-4">⏳</div><h1 class="text-2xl font-bold">Approval Pending</h1><p class="text-slate-400 mt-2">Your account is waiting for an administrator to approve it.</p><p class="text-sm text-slate-300 mt-4">${esc(me.email)}</p><div class="flex gap-3 mt-6"><button id="check" class="flex-1 rounded-xl bg-emerald-500 text-slate-950 font-semibold py-3">Check status</button><button id="logout" class="rounded-xl bg-slate-700 px-5 py-3">Log out</button></div><p id="pendingStatus" class="text-sm text-slate-400 mt-4"></p></section>`;
  document.getElementById('check').onclick=async()=>{document.getElementById('pendingStatus').textContent='Checking…';await renderState();};
  document.getElementById('logout').onclick=logout;
  subscribeProfiles();
 }
 function renderChat(){
  app.innerHTML=`<main class="w-full max-w-6xl h-[92vh] min-h-[540px] rounded-2xl overflow-hidden border border-slate-700 shadow-2xl flex bg-slate-900"><aside class="w-72 md:w-80 border-r border-slate-700 flex flex-col"><header class="p-4 bg-slate-800 flex items-center justify-between"><div><div class="font-bold">Chat Desk</div><div class="text-xs text-slate-400">${esc(me.email)}</div></div><button id="logout" class="text-xs bg-slate-700 rounded-lg px-3 py-2">Log out</button></header><div class="p-3"><button id="broadcast" class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-lg py-2 text-sm font-semibold">Broadcasts</button></div><div id="peers" class="overflow-y-auto scrollbar flex-1"><p class="p-4 text-sm text-slate-400">Loading contacts…</p></div></aside><section class="flex-1 flex flex-col min-w-0"><header class="bg-slate-800 px-5 py-4"><div id="chatTitle" class="font-semibold">Broadcast messages</div><div class="text-xs text-slate-400">Realtime updates enabled</div></header><div id="messages" class="chat-bg scrollbar overflow-y-auto flex-1 p-4 space-y-3"><p class="text-slate-400 text-sm text-center">Loading messages…</p></div><form id="sendForm" class="bg-slate-800 p-3 flex gap-2"><input id="messageInput" maxlength="5000" required placeholder="Type a message…" class="flex-1 min-w-0 rounded-full bg-slate-700 px-5 py-3 outline-none focus:ring-2 focus:ring-emerald-500"><button class="rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6">Send</button></form></section></main>`;
  document.getElementById('logout').onclick=logout;
  document.getElementById('broadcast').onclick=()=>{activePeer=null;document.getElementById('chatTitle').textContent='Broadcast messages';loadMessages();};
  document.getElementById('sendForm').onsubmit=sendMessage; loadPeers();
 }
 async function loadPeers(){
  const {data,error}=await db.from('profiles').select('id,email').eq('is_approved',true).neq('id',me.id).order('email');
  const el=document.getElementById('peers');if(!el)return;
  if(error){el.innerHTML=`<p class="p-4 text-rose-300 text-sm">${esc(error.message)}</p>`;return;}
  el.innerHTML=(data||[]).map(p=>`<button data-id="${esc(p.id)}" data-email="${esc(p.email)}" class="peer w-full text-left p-4 border-b border-slate-800 hover:bg-slate-800"><div class="font-medium truncate">${esc(p.email)}</div><div class="text-xs text-slate-500 mt-1">Open private chat</div></button>`).join('')||'<p class="p-4 text-sm text-slate-400">No other approved users yet.</p>';
  el.querySelectorAll('.peer').forEach(b=>b.onclick=()=>{activePeer=b.dataset.id;document.getElementById('chatTitle').textContent=b.dataset.email;loadMessages();});
 }
 async function loadMessages(){
  const box=document.getElementById('messages');if(!box)return;
  let q=db.from('messages').select('*').order('created_at',{ascending:true}).limit(300);
  if(activePeer) q=q.or(`and(sender_id.eq.${me.id},receiver_id.eq.${activePeer}),and(sender_id.eq.${activePeer},receiver_id.eq.${me.id})`);
  else q=q.is('receiver_id',null);
  const {data,error}=await q;if(error){box.innerHTML=`<p class="text-rose-300 text-sm">${esc(error.message)}</p>`;return;}
  box.innerHTML='';(data||[]).forEach(m=>appendMessage(m,false));box.scrollTop=box.scrollHeight;
 }
 function appendMessage(m,scroll=true){
  const box=document.getElementById('messages');if(!box||document.getElementById('m'+m.id))return;
  const mine=m.sender_id===me.id;
  const wrap=document.createElement('div');wrap.id='m'+m.id;wrap.className='flex '+(mine?'justify-end':'justify-start');
  wrap.innerHTML=`<div class="bubble rounded-2xl px-4 py-2 shadow ${mine?'bg-emerald-800 text-emerald-50 rounded-br-sm':'bg-slate-700 text-slate-100 rounded-bl-sm'}"><div class="whitespace-pre-wrap">${esc(m.text)}</div><div class="text-[10px] text-slate-300/70 text-right mt-1">${time(m.created_at)}</div></div>`;
  box.appendChild(wrap);if(scroll)box.scrollTop=box.scrollHeight;
 }
 async function sendMessage(e){
  e.preventDefault();const input=document.getElementById('messageInput'),text=input.value.trim();if(!text)return;
  const payload={sender_id:me.id,receiver_id:activePeer,text};
  const {error}=await db.from('messages').insert(payload);if(error){alert('Send failed: '+error.message);return;}input.value='';
 }
 function playTone(){const a=document.getElementById('tone');if(a){a.currentTime=0;a.play().catch(()=>{});}}
 function subscribe(){
  if(channel)db.removeChannel(channel);
  channel=db.channel('public-chat-'+me.id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
    const m=p.new;if(!m)return;
    const relevant=(m.receiver_id===null)||(m.sender_id===me.id)||(m.receiver_id===me.id)||(activePeer&&(m.sender_id===activePeer&&m.receiver_id===me.id));
    if(!relevant)return;
    if(m.sender_id!==me.id)playTone();
    if(!activePeer&&m.receiver_id===null)appendMessage(m);
    else if(activePeer&&((m.sender_id===me.id&&m.receiver_id===activePeer)||(m.sender_id===activePeer&&m.receiver_id===me.id)))appendMessage(m);
    else if(m.sender_id!==me.id){const peer=document.querySelector(`[data-id="${CSS.escape(m.sender_id)}"]`);if(peer)peer.classList.add('bg-slate-800');}
   }).subscribe();
  subscribeProfiles();
 }
 function subscribeProfiles(){
  db.channel('profile-status-'+(me?.id||'anon')).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:me?.id?`id=eq.${me.id}`:undefined},async p=>{
   if(p.new?.is_approved){me=p.new;await renderState();}
  }).subscribe();
 }
 function logout(){localStorage.removeItem('rtchat_profile');me=null;activePeer=null;if(channel)db.removeChannel(channel);showAuth();}
 showAuth();
 document.getElementById('authForm').addEventListener('submit',authSubmit);
 loadMe();
})();
</script>
</body></html>
