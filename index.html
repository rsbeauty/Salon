<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal & WhatsApp Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .wa-bg { background-color: #0b141a; }
    .wa-card { background-color: #111b21; }
    .wa-chat-bg { background-color: #0c1317; background-image: radial-gradient(#222d34 1px, transparent 1px); background-size: 20px 20px; }
  </style>
</head>
<body class="wa-bg text-slate-100 min-h-screen flex flex-col justify-center items-center p-3">

  <!-- 1. AUTH SCREEN -->
  <div id="authScreen" class="wa-card p-6 sm:p-8 rounded-2xl w-full max-w-sm shadow-2xl border border-slate-800">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">💬</div>
      <h2 class="text-2xl font-bold text-emerald-400">Public Portal</h2>
      <p class="text-xs text-slate-400 mt-1">Admin ke approve karne ke baad hi chat unlock hogi</p>
    </div>
    <div class="space-y-4">
      <input type="email" id="userEmail" placeholder="Enter your email" class="w-full bg-[#202c33] px-4 py-3 rounded-lg outline-none text-sm text-white focus:ring-2 focus:ring-emerald-500">
      <input type="password" id="userPass" placeholder="Create password" class="w-full bg-[#202c33] px-4 py-3 rounded-lg outline-none text-sm text-white focus:ring-2 focus:ring-emerald-500">
      <div class="flex gap-2 pt-2">
        <button onclick="handleLogin()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-lg font-bold text-sm transition">Login</button>
        <button onclick="handleSignUp()" class="flex-1 bg-[#202c33] hover:bg-slate-700 py-2.5 rounded-lg font-bold text-sm transition">Sign Up</button>
      </div>
      <div id="authMsg" class="text-xs text-center text-red-400 mt-2"></div>
    </div>
  </div>

  <!-- 2. PENDING APPROVAL SCREEN -->
  <div id="pendingScreen" class="hidden wa-card p-8 rounded-2xl w-full max-w-sm text-center border border-amber-500/30 shadow-2xl">
    <div class="text-5xl mb-4">⏳</div>
    <h3 class="text-xl font-bold text-amber-400">Approval Pending</h3>
    <p class="text-sm text-slate-400 mt-2">Aapka account create ho gaya hai. Admin ke approve karne ke baad hi account active hoga.</p>
    <button onclick="checkAccess()" class="mt-6 bg-[#202c33] px-4 py-2.5 rounded-lg text-xs font-semibold hover:bg-slate-700 w-full">Check Status Again</button>
    <button onclick="handleLogout()" class="mt-3 block w-full text-xs text-red-400 hover:underline">Logout</button>
  </div>

  <!-- 3. WHATSAPP CHAT SCREEN -->
  <div id="chatScreen" class="hidden w-full max-w-md h-[95vh] wa-card rounded-2xl flex flex-col overflow-hidden border border-slate-800 shadow-2xl">
    <div class="bg-[#202c33] px-4 py-3 flex items-center justify-between border-b border-slate-700">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-white">A</div>
        <div>
          <h4 class="font-semibold text-sm">Admin Support</h4>
          <span class="text-[11px] text-emerald-400">● Active</span>
        </div>
      </div>
      <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-red-400">Logout</button>
    </div>

    <div id="msgContainer" class="flex-1 wa-chat-bg p-4 overflow-y-auto space-y-3 flex flex-col"></div>

    <div class="bg-[#202c33] p-3 flex gap-2 items-center">
      <input type="text" id="chatInput" placeholder="Type a message..." class="flex-1 bg-[#2a3942] px-4 py-2.5 rounded-full text-sm outline-none text-white focus:ring-1 focus:ring-emerald-500" onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()" class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center hover:bg-emerald-500 transition text-white">➤</button>
    </div>
  </div>

  <audio id="tone" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>

  <script>
    const SUPABASE_URL = "https://kqjzziybvkbkrlpemxdp.supabase.co";
    const SUPABASE_KEY = "sb_publishable__Fiz46xbWxj8ZQMSmCyo0Q_QxCPMzs2";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    const tone = document.getElementById('tone');

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        checkAccess();
      }
    }
    init();

    async function handleSignUp() {
      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPass').value.trim();
      if (!email || !password) return showMsg("Email aur password dono bharein");
      
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return showMsg(error.message);
      currentUser = data.user;
      checkAccess();
    }

    async function handleLogin() {
      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPass').value.trim();
      if (!email || !password) return showMsg("Email aur password dono bharein");

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return showMsg(error.message);
      currentUser = data.user;
      checkAccess();
    }

    async function checkAccess() {
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
      
      document.getElementById('authScreen').classList.add('hidden');

      if (!profile || !profile.is_approved) {
        document.getElementById('pendingScreen').classList.remove('hidden');
        document.getElementById('chatScreen').classList.add('hidden');
      } else {
        document.getElementById('pendingScreen').classList.add('hidden');
        document.getElementById('chatScreen').classList.remove('hidden');
        loadChat();
        listenRealtime();
      }
    }

    async function loadChat() {
      const container = document.getElementById('msgContainer');
      container.innerHTML = '';
      const { data: msgs } = await supabase
        .from('messages')
        .select('*')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id},receiver_id.is.null`)
        .order('created_at', { ascending: true });

      if (msgs) msgs.forEach(renderBubble);
      container.scrollTop = container.scrollHeight;
    }

    function renderBubble(m) {
      const container = document.getElementById('msgContainer');
      const isMe = m.sender_id === currentUser.id;
      const div = document.createElement('div');
      div.className = `max-w-[75%] px-3.5 py-2 rounded-xl text-sm ${isMe ? 'ml-auto bg-[#005c4b] text-white rounded-tr-none' : 'mr-auto bg-[#202c33] text-white rounded-tl-none'}`;
      div.innerHTML = `<div>${m.text}</div><div class="text-[10px] text-slate-400 text-right mt-1">${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function listenRealtime() {
      supabase.channel('user-chat-room')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          const msg = payload.new;
          if (msg.sender_id === currentUser.id || msg.receiver_id === currentUser.id || msg.receiver_id === null) {
            renderBubble(msg);
            if (msg.sender_id !== currentUser.id) {
              tone.currentTime = 0;
              tone.play().catch(() => {});
            }
          }
        })
        .subscribe();
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await supabase.from('messages').insert([{ sender_id: currentUser.id, text }]);
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      location.reload();
    }

    function showMsg(txt) { document.getElementById('authMsg').innerText = txt; }
  </script>
</body>
</html>
